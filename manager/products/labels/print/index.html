<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price labels</title>
    <style>
        @page {
                            size: 38mm 25mm;
                        margin: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            background: #e5e7eb;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print {
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        .no-print button {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            background: #111827;
            color: #fff;
        }

        .no-print .hint { margin-top: 6px; color: #4b5563; font-size: 12px; }

        .label {
            width: 38mm;
            height: 25mm;
            padding: 1.2mm 1.6mm;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .shop {
            font-size: 5.5pt;
            text-transform: uppercase;
            letter-spacing: .3px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .name {
            font-size: 7pt;
            font-weight: bold;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 11pt;
            font-weight: bold;
            line-height: 1.1;
        }

        .price small { font-size: 6pt; font-weight: normal; }

        .weight { font-size: 6pt; font-weight: bold; }

        .barcode svg {
            display: block;
            width: 100%;
            height: 7mm;
        }

        .code { font-family: 'Courier New', monospace; font-size: 6pt; letter-spacing: .5px; }

                    .label {
                margin: 0 auto 6px;
                page-break-after: always;
                break-after: page;
            }
        
        @media print {
            body { background: #fff; }
            .no-print { display: none !important; }
            .label { margin: 0; outline: none !important; }
            .sheet { margin: 0; }
        }
    </style>

<link rel="stylesheet" href="../../../../demo/demo.css"></head>

<body>

    <div class="no-print">
        <button type="button" onclick="window.print()">Print</button>
        <div class="hint">
            0 labels ·
            38 × 25 mm
            · set the printer margins to "None" and scale to 100%.
        </div>
    </div>

            <div class="no-print">No products selected.</div>
    
    
            
        
            
    <script>
        window.addEventListener('load', () => window.print());
    </script>

<script defer src="../../../../demo/data.js"></script><script defer src="../../../../demo/store.js"></script><script defer src="../../../../demo/receipt.js"></script><script defer src="../../../../demo/search.js"></script><script defer src="../../../../demo/lists.js"></script><script defer src="../../../../demo/pos.js"></script><script defer src="../../../../demo/forms.js"></script><script defer src="../../../../demo/demo.js" data-role="manager" data-path="/products/labels/print" data-root="../../../../"></script></body>

</html>
